<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Mallow, The Little Dream Collector — A tiny lavender ghost who collects forgotten dreams and repairs unfinished stories." />
    <meta name="theme-color" content="#fff8f1" />
    <title>Mallow — The Little Dream Collector ✦</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      // Prevent flash of wrong theme
      (function() {
        try {
          var theme = localStorage.getItem('mallow-theme');
          if (theme === 'night') {
            document.documentElement.setAttribute('data-theme', 'night');
          } else if (theme === 'day') {
            document.documentElement.setAttribute('data-theme', 'day');
          } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.setAttribute('data-theme', 'night');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
