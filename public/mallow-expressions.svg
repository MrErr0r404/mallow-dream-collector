<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bodyGrad" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#e4d8fb"/>
      <stop offset="100%" stop-color="#c7b5f5"/>
    </radialGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff5cc"/>
      <stop offset="60%" stop-color="#f4cc77"/>
      <stop offset="100%" stop-color="#e5b342"/>
    </radialGradient>
  </defs>

  <!-- Background Grid -->
  <rect width="400" height="400" fill="#fff8f1"/>
  <line x1="200" y1="0" x2="200" y2="400" stroke="#f6dce8" stroke-dasharray="4,4" stroke-width="2"/>
  <line x1="0" y1="200" x2="400" y2="200" stroke="#f6dce8" stroke-dasharray="4,4" stroke-width="2"/>

  <!-- ================= QUADRANT 1: HAPPY (Top-Left 0..200, 0..200) ================= -->
  <g transform="translate(100, 105)">
    <!-- Label -->
    <text x="0" y="-75" font-family="'Fredoka', sans-serif" font-weight="bold" font-size="14" fill="#a34063" text-anchor="middle" letter-spacing="1">HAPPY</text>
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="48" ry="54" fill="url(#bodyGrad)"/>
    <path d="M-45 22 Q-30 52 -18 36 Q0 55 18 36 Q30 52 45 22 Z" fill="url(#bodyGrad)"/>
    <!-- Forehead Star -->
    <polygon points="0,-46 3,-38 11,-36 5,-31 7,-23 0,-27 -7,-23 -5,-31 -11,-36 -3,-38" fill="url(#starGlow)"/>
    <!-- Cheeks -->
    <ellipse cx="-26" cy="6" rx="8" ry="5" fill="#f6dce8"/>
    <ellipse cx="26" cy="6" rx="8" ry="5" fill="#f6dce8"/>
    <!-- Happy Eyes (curved arcs ^_^) -->
    <path d="M-22 -4 Q-16 -12 -10 -4" stroke="#3d2145" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M10 -4 Q16 -12 22 -4" stroke="#3d2145" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <!-- Happy Open Smile -->
    <path d="M-8 8 Q0 18 8 8" stroke="#3d2145" stroke-width="3" stroke-linecap="round" fill="#a34063"/>
    <!-- Sparkles -->
    <polygon points="36,-28 38,-22 44,-20 38,-18 36,-12 34,-18 28,-20 34,-22" fill="#f4cc77"/>
  </g>

  <!-- ================= QUADRANT 2: SLEEPY (Top-Right 200..400, 0..200) ================= -->
  <g transform="translate(300, 105)">
    <!-- Label -->
    <text x="0" y="-75" font-family="'Fredoka', sans-serif" font-weight="bold" font-size="14" fill="#a34063" text-anchor="middle" letter-spacing="1">SLEEPY</text>
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="48" ry="54" fill="url(#bodyGrad)"/>
    <path d="M-45 22 Q-30 52 -18 36 Q0 55 18 36 Q30 52 45 22 Z" fill="url(#bodyGrad)"/>
    <!-- Forehead Star -->
    <polygon points="0,-46 3,-38 11,-36 5,-31 7,-23 0,-27 -7,-23 -5,-31 -11,-36 -3,-38" fill="url(#starGlow)"/>
    <!-- Cheeks -->
    <ellipse cx="-26" cy="6" rx="8" ry="5" fill="#f6dce8"/>
    <ellipse cx="26" cy="6" rx="8" ry="5" fill="#f6dce8"/>
    <!-- Droopy Half-Closed Eyes -->
    <path d="M-24 -4 Q-16 0 -8 -4" stroke="#3d2145" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <line x1="-22" y1="-2" x2="-10" y2="-2" stroke="#f4cc77" stroke-width="2"/>
    <path d="M8 -4 Q16 0 24 -4" stroke="#3d2145" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <line x1="10" y1="-2" x2="22" y2="-2" stroke="#f4cc77" stroke-width="2"/>
    <!-- Little Resting Mouth -->
    <path d="M-4 9 Q0 11 4 9" stroke="#5c4033" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Zzz Floating -->
    <text x="32" y="-28" font-family="'Fredoka', sans-serif" font-weight="bold" font-size="14" fill="#c7b5f5">z</text>
    <text x="40" y="-38" font-family="'Fredoka', sans-serif" font-weight="bold" font-size="18" fill="#a34063">Z</text>
  </g>

  <!-- ================= QUADRANT 3: CURIOUS (Bottom-Left 0..200, 200..400) ================= -->
  <g transform="translate(100, 305) rotate(-6)">
    <!-- Label -->
    <text x="0" y="-75" font-family="'Fredoka', sans-serif" font-weight="bold" font-size="14" fill="#a34063" text-anchor="middle" letter-spacing="1">CURIOUS</text>
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="48" ry="54" fill="url(#bodyGrad)"/>
    <path d="M-45 22 Q-30 52 -18 36 Q0 55 18 36 Q30 52 45 22 Z" fill="url(#bodyGrad)"/>
    <!-- Forehead Star (tilted) -->
    <polygon points="0,-46 3,-38 11,-36 5,-31 7,-23 0,-27 -7,-23 -5,-31 -11,-36 -3,-38" fill="url(#starGlow)"/>
    <!-- Cheeks -->
    <ellipse cx="-26" cy="6" rx="8" ry="5" fill="#f6dce8"/>
    <ellipse cx="26" cy="6" rx="8" ry="5" fill="#f6dce8"/>
    <!-- Wide Curious Eyes (one slightly wider) -->
    <circle cx="-16" cy="-6" r="9" fill="#3d2145"/>
    <circle cx="-14" cy="-8" r="3.5" fill="#f4cc77"/>
    <circle cx="-18" cy="-4" r="1.5" fill="#ffffff"/>

    <circle cx="16" cy="-8" r="11" fill="#3d2145"/>
    <circle cx="18" cy="-10" r="4.5" fill="#f4cc77"/>
    <circle cx="13" cy="-6" r="2" fill="#ffffff"/>
    <!-- Curious O mouth -->
    <ellipse cx="0" cy="9" rx="3.5" ry="4.5" fill="#3d2145"/>
    <!-- Question Sparkle -->
    <text x="35" y="-22" font-family="'Fredoka', sans-serif" font-weight="bold" font-size="20" fill="#f4cc77">?</text>
  </g>

  <!-- ================= QUADRANT 4: SURPRISED (Bottom-Right 200..400, 200..400) ================= -->
  <g transform="translate(300, 305)">
    <!-- Label -->
    <text x="0" y="-75" font-family="'Fredoka', sans-serif" font-weight="bold" font-size="14" fill="#a34063" text-anchor="middle" letter-spacing="1">SURPRISED</text>
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="48" ry="54" fill="url(#bodyGrad)"/>
    <path d="M-45 22 Q-30 52 -18 36 Q0 55 18 36 Q30 52 45 22 Z" fill="url(#bodyGrad)"/>
    <!-- Sneezing Forehead Star with Burst -->
    <polygon points="0,-48 4,-38 13,-36 6,-30 8,-21 0,-26 -8,-21 -6,-30 -13,-36 -4,-38" fill="url(#starGlow)"/>
    <!-- Shooting Stars Burst from Sneeze -->
    <polygon points="18,-54 20,-50 24,-49 21,-46 22,-42 18,-44 14,-42 15,-46 12,-49 16,-50" fill="#f4cc77"/>
    <polygon points="-20,-56 -18,-52 -14,-51 -17,-48 -16,-44 -20,-46 -24,-44 -23,-48 -26,-51 -22,-52" fill="#f4cc77"/>
    <polygon points="32,-38 34,-35 37,-34 35,-32 36,-29 33,-30 30,-29 31,-32 29,-34 32,-35" fill="#f6dce8"/>
    <!-- Big Blushing Cheeks -->
    <ellipse cx="-26" cy="8" rx="10" ry="6" fill="#f6dce8"/>
    <ellipse cx="26" cy="8" rx="10" ry="6" fill="#f6dce8"/>
    <!-- Wide Round Starry Eyes -->
    <circle cx="-16" cy="-6" r="10" fill="#3d2145"/>
    <circle cx="-14" cy="-8" r="4" fill="#f4cc77"/>
    <circle cx="-18" cy="-4" r="2" fill="#ffffff"/>

    <circle cx="16" cy="-6" r="10" fill="#3d2145"/>
    <circle cx="14" cy="-8" r="4" fill="#f4cc77"/>
    <circle cx="18" cy="-4" r="2" fill="#ffffff"/>
    <!-- Little Round Surprised 'O' Mouth -->
    <circle cx="0" cy="11" r="5" fill="#3d2145"/>
  </g>
</svg>
